<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epilog - Live Seizure Analytics</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <main class="container">
        <h1 class="app-title">Seizure Analytics</h1>

        <div style="display: flex; justify-content: center; width: 100%; margin-bottom: 25px;">
            <a class="nav-button" href="{{ url_for('home') }}">Back to Home</a>
        </div>

        <!-- 12-Month Line / Column Chart -->
        <div class="auth-card" style="max-width: 750px; margin: 0 auto 30px auto; width: 100%;">
            <h2>12-Month Seizure Trends</h2>
            <div style="position: relative; width: 100%; height: 350px;">
                <canvas id="seizureChart"></canvas>
            </div>
        </div>

        <!-- Trigger Distribution Pie Chart -->
        <div class="auth-card" style="max-width: 750px; margin: 0 auto; width: 100%;">
            <h2>Seizure Triggers Breakdown</h2>
            <div style="position: relative; width: 100%; height: 350px; display: flex; justify-content: center;">
                <canvas id="triggerPieChart"></canvas>
            </div>
        </div>
    </main>

    <script>
        let trendChart = null;
        let pieChart = null;

        const pieColors = [
            '#e74c3c', '#3498db', '#f1c40f', '#2ecc71', '#9b59b6', 
            '#e67e22', '#1abc9c', '#34495e', '#d35400', '#7f8c8d'
        ];

        function initCharts() {
            const ctxTrend = document.getElementById('seizureChart').getContext('2d');
            trendChart = new Chart(ctxTrend, {
                data: {
                    labels: [],
                    datasets: [
                        {
                            type: 'line',
                            label: 'Seizure Trend Line',
                            data: [],
                            borderColor: '#2980b9',
                            borderWidth: 3,
                            tension: 0.3,
                            fill: false,
                            pointRadius: 5,
                            pointBackgroundColor: '#2980b9',
                            order: 1
                        },
                        {
                            type: 'bar',
                            label: 'Monthly Seizure Count',
                            data: [],
                            backgroundColor: 'rgba(52, 152, 219, 0.4)',
                            borderColor: '#3498db',
                            borderWidth: 1,
                            borderRadius: 4,
                            order: 2
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: {
                            title: { display: true, text: 'Full 12-Month Period (YYYY-MM)' }
                        },
                        y: {
                            beginAtZero: true,
                            title: { display: true, text: 'Seizure Count' },
                            ticks: { stepSize: 1, precision: 0 }
                        }
                    }
                }
            });

            const ctxPie = document.getElementById('triggerPieChart').getContext('2d');
            pieChart = new Chart(ctxPie, {
                type: 'pie',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Seizures by Trigger',
                        data: [],
                        backgroundColor: [],
                        hoverOffset: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom' },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const total = context.dataset.data.reduce((a, b) => a + b, 0);
                                    const value = context.raw;
                                    const percentage = ((value / total) * 100).toFixed(1);
                                    return ` ${context.label}: ${value} (${percentage}%)`;
                                }
                            }
                        }
                    }
                }
            });
        }

        async function fetchChartData() {
            try {
                const response = await fetch('/api/chart_data');
                if (!response.ok) return;

                const data = await response.json();

                // Update 12-Month Line / Column Chart
                trendChart.data.labels = data.months;
                trendChart.data.datasets[0].data = data.counts;
                trendChart.data.datasets[1].data = data.counts;
                trendChart.update();

                // Update Trigger Pie Chart
                pieChart.data.labels = data.trigger_labels;
                pieChart.data.datasets[0].data = data.trigger_counts;
                pieChart.data.datasets[0].backgroundColor = pieColors.slice(0, data.trigger_labels.length);
                pieChart.update();
            } catch (err) {
                console.error('Failed to fetch live chart data:', err);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            initCharts();
            fetchChartData();

            // Auto-refresh chart data every 5 seconds without reloading the page
            setInterval(fetchChartData, 5000);
        });
    </script>
</body>
</html>
