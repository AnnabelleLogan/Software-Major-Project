<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epilog - Log Summary</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="container">
        <h1 class="app-title">Seizure Logs</h1>

        <!-- Navigation back to Homepage -->
        <div class="button-group" style="margin-bottom: 30px;">
            <a href="/" class="nav-button">Back to Home</a>
        </div>

        <!-- Log Display List -->
        <div id="log-display-container">
            {% if logs %}
                {% for log in logs %}
                    <div class="log-card">
                        <h3 class="log-card-title">{{ log.episode_type }}</h3>
                        <small class="log-card-date">Logged on: {{ log.log_date }} at {{ log.log_time }}</small>
                        <p class="log-card-notes">{{ log.details }}</p>
                    </div>
                {% endfor %}
            {% else %}
                <p style="color: #666666;">No logs recorded yet.</p>
            {% endif %}
        </div>
    </main>
</body>
</html>
