<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epilog - Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="container">
        <h1 class="app-title">Epilog</h1>

        <div class="auth-card">
            <h2>Create Account</h2>

            {% if error %}
                <p style="color: #8b0000; text-align: center; font-weight: bold; margin-bottom: 15px;">{{ error }}</p>
            {% endif %}

            <form action="{{ url_for('register') }}" method="POST" class="auth-form">
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" required placeholder="Choose a username">
                </div>

                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required placeholder="Choose a password" style="width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid #cccccc;">
                </div>

                <div class="modal-button-row">
                    <button type="submit" class="nav-button full-width">Register</button>
                </div>
            </form>

            <p style="text-align: center; margin-top: 20px; font-size: 0.95rem;">
                Already have an account? <a href="{{ url_for('login') }}" style="color: #000000; font-weight: bold;">Log in here</a>
            </p>
        </div>
    </main>
</body>
</html>
