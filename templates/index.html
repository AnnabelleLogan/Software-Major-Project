<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epilog</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="container">
        <h1 class="app-title" style="text-align: center;">Epilog</h1>
        
        <div class="button-group" style="text-align: center; margin-top: 20px;">
            <button type="button" id="open-modal-btn" class="nav-button">Add Log</button>
            <a class="nav-button" href="{{ url_for('log_summary') }}" style="display: inline-block;">Seizure Logs</a>
        </div>

        <!-- Modal Popup Container -->
        <div id="log-modal" class="modal">
            <div class="modal-content">
                <span id="close-modal-btn" class="close-btn">&times;</span>
                <h2 style="text-align: center;">New Log Entry</h2>
             
                <form id="log-form" action="{{ url_for('save_log') }}" method="POST">
                    <div>
                        <label for="log-title">Episode type:</label>
                        <select id="log-title" name="episode_type" required>
                            <option value="" disabled selected>Select an episode type...</option>
                            <option value="Myoclonic Seizure">Myoclonic Seizure</option>
                            <option value="Absent Seizure">Absent Seizure</option>
                            <option value="Grand Mal Seizure">Grand Mal Seizure</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                
                    <div>
                        <label for="log-details">Details / Notes:</label>
                        <textarea id="log-details" name="details" required placeholder="Enter notes..."></textarea>
                    </div>
                
                    <div class="modal-button-row">
                        <button type="submit" class="nav-button">Save Log</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- Modal Toggle Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const modal = document.getElementById('log-modal');
            const openBtn = document.getElementById('open-modal-btn');
            const closeBtn = document.getElementById('close-modal-btn');

            if (openBtn) {
                openBtn.addEventListener('click', () => {
                    modal.style.display = 'flex';
                });
            }

            if (closeBtn) {
                closeBtn.addEventListener('click', () => {
                    modal.style.display = 'none';
                });
            }

            window.addEventListener('click', (event) => {
                if (event.target === modal) {
                    modal.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
